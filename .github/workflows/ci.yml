name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    name: InkAndEchoCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: InkAndEchoCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('InkAndEchoCore/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift test --package-path InkAndEchoCore

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xplatform
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
